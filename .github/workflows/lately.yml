# Keeps the "Lately" strands on home.html current: the last four films (Letterboxd)
# and books (Goodreads) Pob rated. Runs scripts/lately.py and commits only when
# something changed. Public repo, so GitHub-hosted minutes are free.
#
# Books come from Goodreads' public bookshelf widget, which orders by DATE READ,
# so set "date read" on a finished book for it to show. No secret needed; an
# optional GOODREADS_RSS secret (a shelf RSS URL with its key) overrides it.
name: Lately

on:
  schedule:
    - cron: "17 13 * * *"   # once a day, 13:17 UTC (morning in New York)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lately
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the latest films and books
        env:
          GOODREADS_RSS: ${{ secrets.GOODREADS_RSS }}
        run: python3 scripts/lately.py

      - name: Commit if anything changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing new."
            exit 0
          fi
          git config user.name "vutisat"
          git config user.email "pobvuti@gmail.com"
          git add assets/js/lately-data.js assets/img/lately
          git commit -m "Lately: update films and books"
          git push
