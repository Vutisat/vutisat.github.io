<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Concerts &amp; Shows</title>
  <meta name="description" content="Every concert, festival and show Pob has been to, each kept as the wristband worn home.">
  <meta name="theme-color" content="#15131A">
  <meta name="color-scheme" content="dark">
  <link rel="icon" type="image/png" href="assets/icons/favicon-32x32.png" sizes="32x32">
  <link rel="preload" href="assets/fonts/bigshoulders-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/concerts.css">

<body>

  <a href="#drawer" class="skip">Skip to the wristbands</a>

  <header class="top">

  <main>
    <section class="mast" aria-labelledby="title">
      <div class="band band--woven band--mast" style="--c:#E4572E;--ink:#FFFFFF">

        <h1 id="title" class="band__weave">Concerts &amp; Shows</h1>

      <noscript><p class="drawer__empty">The wristbands need JavaScript to come out of the drawer.</p></noscript>

    <section class="wish" aria-labelledby="wish-h">

      <p class="wish__dek">Unworn bands, waiting in the corner of the drawer.</p>

  <footer class="foot">
    <a href="home.html">back home</a>
  </footer>
